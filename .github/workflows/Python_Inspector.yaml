name: Python Inspector

on: 
    push:
    workflow_dispatch:
    

jobs:

  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        run: checkout@v7
            

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
           python-version: '3.11'
        
      - name: Print Version
        run : |
         python --version
         pip --version
         which python

         echo "Inspection Complete"



