name: Ordered Pipeline

on: 
    push:
    workflow_dispatch:
    

jobs:

  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repo
        uses : actions/checkout@v7

      - name: Setup Runtime
        uses: actions/setup-node@v7

      - name: Setup Done
        run: echo "Setup Done"
        
 


  verify:
    needs: setup

    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repo again
        uses : actions/checkout@v7

      - name: print runtime version
        run: node -v

      - name: verify Done
        run: echo "Verify Done"




  finish:
    needs: verify

    runs-on: ubuntu-latest

    steps:
      
      - name: Finish
        run: echo "Pipeline Finished"
