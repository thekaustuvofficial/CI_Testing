name: Incident Switchboard

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format(
        '{0}{1} - {2}',
        inputs.severity == 'low' && 'LOW' || inputs.severity == 'medium' && 'MEDIUM' || 'HIGH',
        inputs.deep_scan == true && ' SCAN' || '',
        github.actor
      )
      || format('{0} - {1}', github.event_name, github.actor)
  }}

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      severity:
        description: Severity
        type: choice
        options:
          - low
          - medium
          - high
        default: low
        required: true

      deep_scan:
        description: Deep scan
        type: boolean
        default: false
        required: false

      skip_tests:
        description: Skip tests
        type: boolean
        default: false
        required: false

      reason:
        description: Reason
        type: string
        required: false

jobs:

  triage:
    name: Triage
    runs-on: ubuntu-latest

    steps:
      - name: Print run information
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Actor: ${{ github.actor }}"
          echo "Run number: ${{ github.run_number }}"

      - name: Print manual inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "Severity: ${{ inputs.severity }}"
          echo "Deep scan: ${{ inputs.deep_scan }}"
          echo "Skip tests: ${{ inputs.skip_tests }}"
          echo "Reason: ${{ inputs.reason }}"

      - name: Print automatic run
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          echo "This run was automatic and no reason was supplied."

      - name: Low severity
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.severity == 'low' }}
        run: echo "Low severety incident: standard investigation is sufficient."

      - name: Medium severity
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.severity == 'medium' }}
        run: echo "Medium severity incident: increased investigation is required."

      - name: High severity
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.severity == 'high' }}
        run: echo "High severity incident: immediate investigation and scanning required."


  tests:
    name: Tests
    needs: triage
    runs-on: ubuntu-latest

    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_tests != true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run tests
        working-directory: app
        run: npm test


  scan:
    name: Scan
    needs: triage
    runs-on: ubuntu-latest

    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          && (inputs.deep_scan == true || inputs.severity == 'high') }}

    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Create scan report
        run: |
          cat > scan.json <<EOF
          {
            "severity": "${{ inputs.severity }}",
            "deep_scan": ${{ inputs.deep_scan }},
            "actor": "${{ github.actor }}",
            "run_number": ${{ github.run_number }},
            "time_utc": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Read scan results
        run: |
          echo "Severity: $(jq -r '.severity' scan.json)"
          echo "Actor: $(jq -r '.actor' scan.json)"


  report:
    name: Report
    needs:
      - tests
      - scan
    runs-on: ubuntu-latest

    if: always()

    steps:
      - name: Print job results
        run: |
          echo "Tests: ${{ needs.tests.result }}"
          echo "Scan: ${{ needs.scan.result }}"

      - name: Print summary
        run: |
          if [ "${{ needs.tests.result }}" = "success" ] || [ "${{ needs.tests.result }}" = "skipped" ]; then
            if [ "${{ needs.scan.result }}" = "success" ] || [ "${{ needs.scan.result }}" = "skipped" ]; then
              echo "Everything that ran was successful."
            else
              echo "Some work completed successfully, but the scan failed."
            fi
          else
            echo "Some work failed."
          fi

      - name: Close switchboard
        run: echo "Switchboard closed"