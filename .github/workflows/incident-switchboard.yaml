name: Incident Switchboard

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format(
        '{0}{1} - {2}',
        inputs.severity == 'low' && 'LOW' || inputs.severity == 'medium' && 'MEDIUM' || 'HIGH',
        inputs.deep_scan == true && ' SCAN' || '',
        github.actor
      )
      || format('{0} - {1}', github.event_name, github.actor)
  }}

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      severity:
        description: Severity
        type: choice
        options:
          - low
          - medium
          - high
        default: low
        required: true

      deep_scan:
        description: Deep scan
        type: boolean
        default: false
        required: false

      skip_tests:
        description: Skip tests
        type: boolean
        default: false
        required: false

      reason:
        description: Reason
        type: string
        required: false

jobs:

  triage:
    name: Triage
    runs-on: ubuntu-latest

    steps:
      - name: Print run information
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "Event: $EVENT"
          echo "Ref: $REF"
          echo "Actor: $ACTOR"
          echo "Run number: $RUN_NUMBER"

      - name: Print manual inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          SEVERITY: ${{ inputs.severity }}
          DEEP_SCAN: ${{ inputs.deep_scan }}
          SKIP_TESTS: ${{ inputs.skip_tests }}
          REASON: ${{ inputs.reason }}
        run: |
          echo "Severity: $SEVERITY"
          echo "Deep scan: $DEEP_SCAN"
          echo "Skip tests: $SKIP_TESTS"
          echo "Reason: $REASON"

      - name: Print automatic run
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          echo "This run was automatic and no reason was supplied."

      - name: Low severity
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.severity == 'low' }}
        run: |
          echo "Low severity incident: standard investigation is sufficient."

      - name: Medium severity
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.severity == 'medium' }}
        run: |
          echo "Medium severity incident: increased investigation is required."

      - name: High severity
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.severity == 'high' }}
        run: |
          echo "High severity incident: immediate investigation and scanning required."


  tests:
    name: Tests
    needs: triage
    runs-on: ubuntu-latest

    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_tests != true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run tests
        working-directory: app
        run: npm test


  scan:
    name: Scan
    needs: triage
    runs-on: ubuntu-latest

    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          && (inputs.deep_scan == true || inputs.severity == 'high') }}

    steps:
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Create scan report
        env:
          SEVERITY: ${{ inputs.severity }}
          DEEP_SCAN: ${{ inputs.deep_scan }}
          ACTOR: ${{ github.actor }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          cat > scan.json <<EOF
          {
            "severity": "$SEVERITY",
            "deep_scan": $DEEP_SCAN,
            "actor": "$ACTOR",
            "run_number": $RUN_NUMBER,
            "time_utc": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Read scan results
        run: |
          echo "Severity: $(jq -r '.severity' scan.json)"
          echo "Actor: $(jq -r '.actor' scan.json)"


  report:
    name: Report
    needs:
      - tests
      - scan
    runs-on: ubuntu-latest

    if: always()

    steps:
      - name: Print job results
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          SCAN_RESULT: ${{ needs.scan.result }}
        run: |
          echo "Tests: $TESTS_RESULT"
          echo "Scan: $SCAN_RESULT"

      - name: Print summary
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          SCAN_RESULT: ${{ needs.scan.result }}
        run: |
          if [ "$TESTS_RESULT" = "success" ] || [ "$TESTS_RESULT" = "skipped" ]; then
            if [ "$SCAN_RESULT" = "success" ] || [ "$SCAN_RESULT" = "skipped" ]; then
              echo "Everything that ran was successful."
            else
              echo "Some work completed successfully, but the scan failed."
            fi
          else
            echo "Some work failed."
          fi

      - name: Close switchboard
        run: |
          echo "Switchboard closed"