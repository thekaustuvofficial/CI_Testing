
name: Pipeline Archive

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      build_mode:
        description: "Choose the build mode"
        required: true
        type: choice
        options:
          - quick
          - full
        default: quick

      skip_cache:
        description: "Skip dependency cache"
        required: false
        type: boolean
        default: false

env:
  APP_NAME: my-react-app

jobs:
  test-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: myapp

    outputs:
      build_ran: ${{ steps.build.outputs.ran }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Cache dependencies
        id: cache
        if: ${{ inputs.skip_cache != true }}
        uses: actions/cache@v6
        with:
          path: myapp/node_modules
          key: deps-node-modules-${{ hashFiles('myapp/package-lock.json') }}

      - name: Set cache status
        id: cache-status
        shell: bash
        run: |
          if [[ "${{ inputs.skip_cache }}" == "true" ]]; then
            echo "used=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.cache.outputs.cache-hit }}" == "true" ]]; then
            echo "used=true" >> "$GITHUB_OUTPUT"
          else
            echo "used=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: ${{ inputs.skip_cache == true || steps.cache.outputs.cache-hit != 'true' }}
        run: npm ci

      - name: Unit tests with coverage
        run: npm run test -- --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-coverage-${{ github.run_number }}
          path: myapp/coverage
          retention-days: ${{ vars.ARTIFACT_RETENTION_DAYS }}

      - name: Build app
        id: build
        if: ${{ inputs.build_mode == 'full' || github.event_name == 'push' }}
        run: |
          npm run build
          echo "ran=true" >> "$GITHUB_OUTPUT"

      - name: Explain skipped build
        if: ${{ inputs.build_mode != 'full' && github.event_name != 'push' }}
        run: echo "Build skipped because this is a quick run and the event is not a push to main."

      - name: Upload build artifact
        if: ${{ steps.build.outputs.ran == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ github.sha }}
          path: myapp/build
          retention-days: ${{ vars.ARTIFACT_RETENTION_DAYS }}

      - name: Print pipeline summary
        run: |
          echo "${{ format(
            'App: {0} | Build mode: {1} | Cache used: {2}',
            env.APP_NAME,
            github.event_name == 'workflow_dispatch' && inputs.build_mode || 'n/a — push',
            steps.cache-status.outputs.used
          ) }}"

  verify-archive:
    runs-on: ubuntu-latest
    needs: test-build
    if: ${{ always() }}

    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_NAME }}-coverage-${{ github.run_number }}
          path: archive/coverage

      - name: Download build artifact
        if: ${{ needs.test-build.outputs.build_ran == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_NAME }}-${{ github.sha }}
          path: archive/build

      - name: Show downloaded archive structure
        run: tree -L 2 archive

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Create archive manifest
        env:
          APP_NAME: ${{ env.APP_NAME }}
          RUN_NUMBER: ${{ github.run_number }}
          RETENTION_DAYS: ${{ vars.ARTIFACT_RETENTION_DAYS }}
          BUILD_PRESENT: ${{ needs.test-build.outputs.build_ran == 'true' }}
        run: |
          jq -n \
            --arg app_name "$APP_NAME" \
            --argjson run_number "$RUN_NUMBER" \
            --argjson retention_days "$RETENTION_DAYS" \
            --argjson build_artifact_present "$BUILD_PRESENT" \
            '{
              app_name: $app_name,
              run_number: $run_number,
              retention_days: $retention_days,
              build_artifact_present: $build_artifact_present
            }' > archive-manifest.json

          cat archive-manifest.json

      - name: Read manifest value
        run: |
          echo "Build artifact present: $(jq -r '.build_artifact_present' archive-manifest.json)"

      - name: Archive verified
        run: echo "Archive verified"

